name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dva deploya u isto vrijeme bi se gazila na serveru.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_DIR: /srv/videowall

jobs:
  build:
    name: Slika
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ime.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Ime slike
        id: ime
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # VPS je gotovo sigurno amd64. Za arm64 dodaj linux/arm64 — ali onda
          # se better-sqlite3 i sharp kompajliraju pod QEMU-om i build traje.
          platforms: linux/amd64
          tags: |
            ${{ steps.ime.outputs.image }}
            ${{ steps.ime.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH ključ
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Kopiraj docker-compose.yml
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p ${{ env.APP_DIR }}"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$SSH_HOST:${{ env.APP_DIR }}/"

      - name: Povuci i podigni
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          IMAGE: ${{ needs.build.outputs.image }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='${{ env.APP_DIR }}' IMAGE='$IMAGE' GH_USER='$GH_USER' GH_TOKEN='$GH_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          # IMAGE se upisuje u .env: compose ga odatle čita, a na serveru se uvijek
          # vidi koja verzija trenutno radi. Vraćanje unazad je izmjena te linije
          # i `docker compose up -d`.
          touch .env
          chmod 600 .env
          grep -v '^IMAGE=' .env > .env.novi || true
          echo "IMAGE=$IMAGE" >> .env.novi
          mv .env.novi .env
          chmod 600 .env

          # Token vrijedi samo dok traje ovaj posao — na serveru ne ostaje ništa.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker compose pull
          docker compose up -d
          docker logout ghcr.io > /dev/null

          # Zdravlje se čita sa kontejnera, ne sa porta na hostu: HEALTHCHECK iz
          # slike zove /time iznutra. Da se gleda 127.0.0.1:4000, deploy bi
          # prijavio uspjeh i kad na tom portu odgovara neki sasvim drugi proces.
          zdravlje() { docker inspect --format '{{.State.Health.Status}}' videowall 2>/dev/null || true; }
          radi() { docker inspect --format '{{.State.Running}}' videowall 2>/dev/null || true; }

          if [ -z "$(zdravlje)" ]; then
            echo "Kontejner nema HEALTHCHECK — deploy ne može potvrditi da radi." >&2
            exit 1
          fi

          for _ in $(seq 1 30); do
            case "$(zdravlje)" in
              healthy)
                echo "podignuto: $IMAGE"
                docker compose ps
                docker image prune -f > /dev/null
                exit 0
                ;;
              unhealthy)
                echo "Kontejner je prijavljen kao unhealthy." >&2
                break
                ;;
            esac
            # Ako je kontejner pao, nema smisla čekati punih 60 sekundi.
            [ "$(radi)" = "true" ] || { echo "Kontejner se ugasio." >&2; break; }
            sleep 2
          done

          echo "Deploy nije uspio. Stanje i zadnjih 50 redova loga:" >&2
          docker compose ps >&2
          docker compose logs --tail 50 >&2
          exit 1
          REMOTE
