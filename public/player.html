<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video zid — player</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
  }
  body {
    cursor: none;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-user-select: none; user-select: none;
  }

  /* Fiksni okvir ekrana. Iz njegovog clientHeight računamo svu geometriju. */
  #viewport {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden; background: #000;
  }

  /* Video ne živi u sloju sa slikama. Na Tizenu <video> ide u posebnu
     hardversku ravninu: transform, opacity i transition na njemu se ili
     ignorišu ili daju crn pravougaonik. Zato mu ostaje samo visibility, a
     slika prelazi preko njega — #wall je iznad #videos. */
  #videos {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0; background: #000;
  }
  #videos video {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    background: #000;
    visibility: hidden;
  }
  #videos video.shown { visibility: visible; }

  /* Nosi pomak panela (translateY). Visina = WALL_H. */
  #wall {
    position: absolute; top: 0; left: 0; width: 100%;
    z-index: 1;
    will-change: transform;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }

  /* Sloj sa pokretom. Dva ih je, radi prelaza. Samo slike — video je ispod. */
  .layer {
    position: absolute; top: 0; left: 0; width: 100%;
    opacity: 0;
    -webkit-transition: opacity 400ms linear;
    transition: opacity 400ms linear;
    will-change: transform, opacity;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .layer img {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    -webkit-user-drag: none;
    background: #000;
  }

  /* Crn ekran sa porukom — nikad bijeli ekran. */
  #overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #000; color: #7a7a7a;
    display: -webkit-box; display: flex;
    -webkit-box-align: center; align-items: center;
    -webkit-box-pack: center; justify-content: center;
    text-align: center;
    font-size: 22px; line-height: 1.6;
    z-index: 50;
  }
  #overlay.hidden { display: none; }
  #overlay .big { color: #cfcfcf; font-size: 28px; }

  #hud {
    position: fixed; top: 12px; left: 12px;
    z-index: 60;
    background: rgba(0, 0, 0, 0.72);
    border: 1px solid #333;
    padding: 10px 14px;
    font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.5; color: #9fe0a0;
    white-space: pre;
    display: none;
  }
  #hud.on { display: block; }
</style>
</head>
<body>

<div id="viewport">
  <div id="videos">
    <video id="video0" muted playsinline webkit-playsinline preload="auto"></video>
    <video id="video1" muted playsinline webkit-playsinline preload="auto"></video>
  </div>
  <div id="wall">
    <div class="layer" id="layer0"><img alt=""></div>
    <div class="layer" id="layer1"><img alt=""></div>
  </div>
</div>

<div id="overlay"><div id="overlayText">Pokretanje…</div></div>
<pre id="hud"></pre>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- parametri

  var params = {};
  (function parseQuery() {
    var q = location.search.replace(/^\?/, '');
    if (!q) return;
    var pairs = q.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var kv = pairs[i].split('=');
      params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    }
  })();

  var DISPLEJ = parseInt(params.displej, 10);
  if (!(DISPLEJ >= 1 && DISPLEJ <= 3)) DISPLEJ = 1;

  var HUD_ON = params.hud === '1';
  var PANEL_TOKEN = params.token || 'panel-dev-token';
  var BEZEL_OVERRIDE = params.bezel ? parseInt(params.bezel, 10) : null;
  // Video se podrazumijevano pušta pravo sa URL-a: blob od stotinu megabajta
  // Tizen ne preživi, a hardverski dekoder na blob izvoru zna ostati crn.
  // `&videoblob=1` vraća staro ponašanje, za slučaj da mreža pravi problem.
  var VIDEO_BLOB = params.videoblob === '1';

  var CLOCK_SYNC_MS = 60000;      // resinhronizacija sata
  var CLOCK_PROBES = 7;           // zahtjeva po sinhronizaciji, čuva se najbrži
  var PLAYLIST_POLL_MS = 15000;   // provjera ima li `next`
  var HEARTBEAT_MS = 30000;
  var FADE_MS = 400;
  var FATAL_RELOAD_MS = 15000;
  var RELOAD_HOUR = 4;            // noćni reload

  var VIDEO_SYNC_MS = 250;        // koliko često se provjerava zaostatak videa
  var VIDEO_SOFT_S = 0.04;        // ispod ovoga se ne dira ništa
  var VIDEO_HARD_S = 0.35;        // iznad ovoga ide skok umjesto brzine
  var VIDEO_REVEAL_MS = 2000;     // koliko se najduže čeka prvi frejm

  // ------------------------------------------------------------------- elementi

  var viewportEl = document.getElementById('viewport');
  var wallEl = document.getElementById('wall');
  var overlayEl = document.getElementById('overlay');
  var overlayTextEl = document.getElementById('overlayText');
  var hudEl = document.getElementById('hud');
  if (HUD_ON) hudEl.className = 'on';

  function makeLayer(id) {
    var el = document.getElementById(id);
    return { el: el, img: el.querySelector('img'), item: null, startMs: 0 };
  }

  function makeVideoSlot(id) {
    var el = document.getElementById(id);
    // Atribut `muted` nije dovoljan na svim browserima da autoplay prođe.
    el.muted = true;
    el.defaultMuted = true;
    el.loop = false;   // ciklus vodi sat, ne video element

    var slot = { el: el, item: null, startMs: 0, src: null, shown: false, cancelWait: null };

    el.addEventListener('error', function () {
      var code = el.error ? el.error.code : '?';
      softError(new Error('Video greška ' + code + ' (' + shortName(slot.src) + ')'));
    }, false);

    return slot;
  }

  var layers = [makeLayer('layer0'), makeLayer('layer1')];
  var activeLayer = 0;
  var zCounter = 1;

  var videos = [makeVideoSlot('video0'), makeVideoSlot('video1')];
  var activeVideo = -1;   // indeks slota koji je u kadru, -1 kad ide slika
  var videoZ = 1;

  // ---------------------------------------------------------------------- sat

  // Sidro sinhronizacije. Poslije mjerenja se Date.now() više ne dira —
  // na Tizenu zna skočiti kad televizor sam sinhronizuje svoj sat.
  var clock = {
    synced: false,
    anchorServerMs: 0,     // serversko vrijeme u trenutku sidrenja
    anchorMonoMs: 0,       // performance.now() u istom trenutku
    offsetMs: 0,           // samo za dijagnostiku
    rttMs: 0,
    lastDriftMs: 0,
    lastSyncMonoMs: 0
  };

  function localNow() { return Date.now(); }
  function monoNow() { return performance.now(); }

  // Serversko vrijeme, izvedeno iz sidra plus proteklo monotono vrijeme.
  function serverNow() {
    if (!clock.synced) return Date.now();
    return clock.anchorServerMs + (monoNow() - clock.anchorMonoMs);
  }

  function syncClock() {
    var best = null;
    var done = 0;

    function probe() {
      var t0 = localNow();
      var m0 = monoNow();
      return fetch('/time?_=' + t0, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status + ' na /time');
          return res.text();
        })
        .then(function (text) {
          var t1 = localNow();
          var m1 = monoNow();
          var ts = parseInt(text, 10);
          if (!isFinite(ts)) throw new Error('/time nije vratio broj');
          var rtt = m1 - m0;
          // NTP princip preko HTTP-a
          var offset = ts + (t1 - t0) / 2 - t1;
          if (!best || rtt < best.rtt) {
            best = { rtt: rtt, offset: offset, localMs: t1, monoMs: m1 };
          }
          done++;
        });
    }

    var chain = Promise.resolve();
    for (var i = 0; i < CLOCK_PROBES; i++) chain = chain.then(probe);

    return chain.then(function () {
      if (!best) throw new Error('Sinhronizacija sata nije uspjela');
      var predicted = clock.synced ? serverNow() : null;
      clock.anchorServerMs = best.localMs + best.offset;
      clock.anchorMonoMs = best.monoMs;
      clock.offsetMs = best.offset;
      clock.rttMs = best.rtt;
      clock.lastSyncMonoMs = best.monoMs;
      clock.synced = true;
      if (predicted !== null) clock.lastDriftMs = predicted - clock.anchorServerMs;
      log('sat sinhronizovan: offset ' + best.offset.toFixed(1) + ' ms, rtt ' + best.rtt.toFixed(1) + ' ms');
    });
  }

  // ------------------------------------------------------------------ geometrija

  var geom = { bezel: 48, panelW: 0, panelH: 0, wallH: 0 };

  function applyGeometry() {
    geom.panelW = viewportEl.clientWidth;
    geom.panelH = viewportEl.clientHeight;
    geom.wallH = 3 * geom.panelH + 2 * geom.bezel;

    var offsetY = -(DISPLEJ - 1) * (geom.panelH + geom.bezel);

    wallEl.style.height = geom.wallH + 'px';
    wallEl.style.transform = 'translate3d(0, ' + offsetY + 'px, 0)';
    wallEl.style.webkitTransform = 'translate3d(0, ' + offsetY + 'px, 0)';

    for (var i = 0; i < layers.length; i++) {
      layers[i].el.style.height = geom.wallH + 'px';
    }
    for (var j = 0; j < videos.length; j++) {
      applyVideoGeometry(videos[j]);
    }
  }

  // Izrezani dio je tačno ono što panel prikazuje — puni ekran, bez pomaka.
  // Stara objava bez dijelova nosi cijeli kadar zida, pa se mora pomjeriti; na
  // <video> to ide preko `top`, nikad transformom.
  function applyVideoGeometry(slot) {
    var el = slot.el;
    if (slot.item && slot.item.whole) {
      el.style.height = geom.wallH + 'px';
      el.style.top = (-(DISPLEJ - 1) * (geom.panelH + geom.bezel)) + 'px';
      el.style.objectFit = 'cover';
    } else {
      el.style.height = '100%';
      el.style.top = '0';
      el.style.objectFit = 'fill';
    }
  }

  function setBezel(px) {
    var value = BEZEL_OVERRIDE !== null ? BEZEL_OVERRIDE : px;
    if (!isFinite(value) || value < 0) return;
    if (value === geom.bezel) return;
    geom.bezel = value;
    applyGeometry();
  }

  window.addEventListener('resize', applyGeometry, false);

  // -------------------------------------------------------------------- pokret

  function motionTransform(motion, p) {
    var kind = motion && motion.kind ? motion.kind : 'none';

    if (kind === 'kenburns') {
      var from = typeof motion.scaleFrom === 'number' ? motion.scaleFrom : 1.0;
      var to = typeof motion.scaleTo === 'number' ? motion.scaleTo : 1.06;
      var panY = typeof motion.panY === 'number' ? motion.panY : 0;
      var scale = from + (to - from) * p;
      return 'translate3d(0, ' + (panY * p).toFixed(4) + '%, 0) scale(' + scale.toFixed(5) + ')';
    }

    if (kind === 'driftY') {
      var drift = typeof motion.panY === 'number' ? motion.panY : -2;
      // Blagi scale da klizanje ne otkrije rub slike.
      return 'translate3d(0, ' + (drift * p).toFixed(4) + '%, 0) scale(1.04)';
    }

    return 'translate3d(0, 0, 0) scale(1)';
  }

  // ------------------------------------------------------------------- sadržaj

  // Bundle = jedna verzija plejliste sa slikama već u memoriji (blob URL-ovi).
  var current = null;   // { version, epoch, items, totalMs, urls }
  var pending = null;   // { version, activeFrom, epoch, items, totalMs, urls }
  var readyVersion = null;
  var loadingVersion = null;

  var itemTimer = null;
  var switchTimer = null;
  var preloadTimer = null;
  var shownIndex = -1;
  var shownItem = null;     // šta je trenutno u kadru, slika ili video
  var shownStartMs = 0;     // kad je ta stavka počela, po serverskom satu
  var lastError = null;
  var bootMonoMs = monoNow();

  // Bez `no-store`: ime fajla nosi heš sadržaja, pa je isti URL uvijek isti bajt
  // i keš ne može poslužiti stari sadržaj. Server šalje immutable na 30 dana, pa
  // reload panela ne skida ponovo desetine megabajta. Na keš se i dalje ne
  // oslanjamo — sve završi u memoriji, a promašaj znači samo jedan mrežni put.
  function fetchBlob(url, onBytes) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' za ' + url);
      // Video zna biti desetinama megabajta, pa je napredak po bajtu jedini
      // koji nešto znači. Ako browser nema streamove, ide obični blob.
      if (!res.body || !res.body.getReader) return res.blob();

      var reader = res.body.getReader();
      var chunks = [];
      return (function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return new Blob(chunks);
          chunks.push(chunk.value);
          if (onBytes) onBytes(chunk.value.length);
          return pump();
        });
      })();
    });
  }

  // Odakle je fajl stigao: transferSize 0 znači da ga je browser panela imao u
  // kešu. Jedini način da se sazna preživljava li keš Tizena gašenje panela —
  // bez toga se o tome samo nagađa.
  var lastLoad = { cache: 0, network: 0 };

  function odakleStiglo(file, brojac) {
    if (!performance.getEntriesByName) return;
    var entries = performance.getEntriesByName(location.origin + file);
    if (!entries.length) return;
    var entry = entries[entries.length - 1];
    if (entry.transferSize === undefined) return;
    if (entry.transferSize === 0) brojac.cache++; else brojac.network++;
  }

  // Koji fajl ovaj panel pušta. Server reže video na tri dijela od 1920 × 1080
  // i šalje ih u `files` — dekoder na Tizenu ne pušta kadar viši od 2160 px, pa
  // je cijeli zid od 1920 × 3336 crn ekran bez greške. `files` nema samo kod
  // objava starijih od sječenja: tad ide cijeli kadar, pomjeren CSS-om.
  function videoFileFor(item) {
    if (item.files && item.files.length === 3 && item.files[DISPLEJ - 1]) {
      return { file: item.files[DISPLEJ - 1], whole: false };
    }
    return { file: item.file, whole: true };
  }

  function fileFor(item) {
    if (item.type === 'video') return videoFileFor(item);
    return { file: item.file, whole: false };
  }

  function loadBundle(source, onProgress) {
    var items = source.items || [];
    var urls = {};
    var loaded = 0;
    var bytes = 0;
    var brojac = { cache: 0, network: 0 };
    var chain = Promise.resolve();

    items.forEach(function (item) {
      var pick = fileFor(item);
      chain = chain.then(function () {
        if (urls[pick.file]) { loaded++; return null; }

        // Video se ne uzima u memoriju: <video> ga vuče sam, sa URL-a.
        if (item.type === 'video' && !VIDEO_BLOB) {
          urls[pick.file] = pick.file;
          loaded++;
          if (onProgress) onProgress(loaded, items.length, bytes);
          return null;
        }

        return fetchBlob(pick.file, function (chunkBytes) {
          bytes += chunkBytes;
          if (onProgress) onProgress(loaded, items.length, bytes);
        }).then(function (blob) {
          urls[pick.file] = URL.createObjectURL(blob);
          loaded++;
          odakleStiglo(pick.file, brojac);
          if (onProgress) onProgress(loaded, items.length, bytes);
        });
      });
    });

    return chain.then(function () {
      lastLoad = brojac;
      var totalMs = 0;
      var prepared = items.map(function (item) {
        var durMs = Math.max(1000, Math.round(Number(item.duration) * 1000));
        var pick = fileFor(item);
        totalMs += durMs;
        return {
          id: item.id,
          type: item.type === 'video' ? 'video' : 'image',
          file: pick.file,
          whole: pick.whole,
          url: urls[pick.file],
          durMs: durMs,
          motion: item.motion || { kind: 'none' }
        };
      });

      return {
        version: source.version,
        epoch: Number(source.epoch),
        activeFrom: source.activeFrom ? Number(source.activeFrom) : null,
        items: prepared,
        totalMs: totalMs,
        urls: urls
      };
    });
  }

  // Video se pušta sa svoje adrese, pa u mapi stoje i obični URL-ovi —
  // revoke ide samo nad onim što je stvarno blob.
  function releaseBundle(bundle) {
    if (!bundle) return;
    for (var file in bundle.urls) {
      if (Object.prototype.hasOwnProperty.call(bundle.urls, file)) {
        var url = bundle.urls[file];
        if (typeof url === 'string' && url.indexOf('blob:') === 0) {
          try { URL.revokeObjectURL(url); } catch (e) {}
        }
      }
    }
  }

  // --------------------------------------------------------------- reprodukcija

  // Gdje smo u ciklusu prema serverskom vremenu. Sva tri panela dobiju isti broj.
  function cycleState(t) {
    if (!current || !current.items.length || current.totalMs <= 0) return null;
    var span = current.totalMs;
    var pos = ((t - current.epoch) % span + span) % span;
    var acc = 0;
    for (var i = 0; i < current.items.length; i++) {
      var dur = current.items[i].durMs;
      if (pos < acc + dur) {
        return {
          index: i,
          offset: pos - acc,
          startMs: t - (pos - acc),
          boundaryMs: t + (acc + dur - pos)
        };
      }
      acc += dur;
    }
    return { index: 0, offset: 0, startMs: t, boundaryMs: t + current.items[0].durMs };
  }

  // Pozicija u videu se postavlja prema serverskom satu, isto kao faza Ken
  // Burnsa kod slika. Razlika je što ovdje postoji dekoder koji može zaostati.
  function seekVideo(video, seconds) {
    if (video.readyState >= 1) {
      try { video.currentTime = seconds; } catch (e) {}
      return;
    }
    var once = function () {
      video.removeEventListener('loadedmetadata', once, false);
      try { video.currentTime = seconds; } catch (e) {}
    };
    video.addEventListener('loadedmetadata', once, false);
  }

  function slotIndex(slot) { return slot === videos[0] ? 0 : 1; }

  // Slot u kojem je taj fajl već učitan (preload), inače prvi slobodan.
  function slotFor(item) {
    var i;
    for (i = 0; i < videos.length; i++) if (videos[i].src === item.url) return videos[i];
    for (i = 0; i < videos.length; i++) if (!videos[i].shown) return videos[i];
    return videos[0];
  }

  function attachVideo(slot, item) {
    slot.item = item;
    applyVideoGeometry(slot);
    if (slot.src === item.url) return;
    cancelWait(slot);
    slot.src = item.url;
    slot.el.src = item.url;
    slot.el.load();
  }

  function hideVideo(slot) {
    slot.shown = false;
    slot.el.className = '';
    if (!slot.el.paused) slot.el.pause();
  }

  // Dekoder se pušta tek ovdje: bez removeAttribute + load() Tizen drži
  // hardversku ravninu zauzetom i sljedeći video ostane crn.
  function releaseVideo(slot) {
    cancelWait(slot);
    hideVideo(slot);
    slot.item = null;
    slot.startMs = 0;
    if (slot.src) {
      slot.src = null;
      slot.el.removeAttribute('src');
      slot.el.load();
    }
  }

  function cancelWait(slot) {
    if (slot.cancelWait) slot.cancelWait();
  }

  // Video se otkriva tek kad stvarno ima frejm. Dok ga nema, iznad njega stoji
  // slika prethodne stavke — zato prelaz nema crnog bljeska.
  function waitForFrame(slot, onReady) {
    cancelWait(slot);
    var video = slot.el;
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      cancelWait(slot);
      onReady();
    }

    function onTime() { if (video.readyState >= 2) finish(); }

    video.addEventListener('playing', finish, false);
    video.addEventListener('timeupdate', onTime, false);
    // Ako dekoder ništa ne javi — a Tizen zna ćutati — otkrivamo ga svejedno.
    var timer = setTimeout(finish, VIDEO_REVEAL_MS);

    slot.cancelWait = function () {
      clearTimeout(timer);
      video.removeEventListener('playing', finish, false);
      video.removeEventListener('timeupdate', onTime, false);
      slot.cancelWait = null;
    };

    if (video.readyState >= 2 && !video.seeking) finish();
  }

  function startVideo(slot, item, startMs) {
    var wanted = (serverNow() - startMs) / 1000;
    var limit = item.durMs / 1000 - 0.05;
    if (wanted < 0) wanted = 0;
    if (limit > 0 && wanted > limit) wanted = limit;

    seekVideo(slot.el, wanted);
    slot.el.playbackRate = 1;

    var promise = slot.el.play();
    if (promise && promise.catch) {
      promise.catch(function (err) {
        softError(new Error('Video se ne pokreće: ' + (err && err.message ? err.message : err)));
      });
    }
  }

  function showVideo(item, startMs, nextItem) {
    var slot = slotFor(item);
    attachVideo(slot, item);
    slot.startMs = startMs;
    activeVideo = slotIndex(slot);

    startVideo(slot, item, startMs);
    waitForFrame(slot, function () { revealVideo(slot, nextItem); });
  }

  function revealVideo(slot, nextItem) {
    // Frejm je stigao sa zakašnjenjem, a stavka je otišla dalje: otkrivanje bi
    // sad sakrilo sliku koja je već u kadru i ostavilo zamrznut video na zidu.
    if (activeVideo < 0 || videos[activeVideo] !== slot) return;

    videoZ++;
    slot.el.style.zIndex = String(videoZ);
    slot.el.className = 'shown';
    slot.shown = true;

    // Tek sad slika izlazi. Obrnut redoslijed bi dao crn ekran na trenutak.
    for (var i = 0; i < layers.length; i++) layers[i].el.style.opacity = '0';

    var other = videos[1 - slotIndex(slot)];
    if (other.shown) hideVideo(other);
    releaseLater(other, nextItem);
  }

  function showImage(item, startMs, nextItem) {
    var back = 1 - activeLayer;
    var layer = layers[back];

    if (layer.img.getAttribute('src') !== item.url) layer.img.src = item.url;
    layer.item = item;
    layer.startMs = startMs;

    var t = serverNow();
    var p = clamp01((t - startMs) / item.durMs);
    layer.el.style.transform = motionTransform(item.motion, p);
    layer.el.style.webkitTransform = motionTransform(item.motion, p);

    zCounter++;
    layer.el.style.zIndex = String(zCounter);
    layer.el.style.opacity = '1';
    layers[activeLayer].el.style.opacity = '0';
    activeLayer = back;

    // Slika se fade-uje preko videa; video se gasi tek kad prelaz prođe.
    // Gase se svi slotovi u kadru, ne samo aktivni: zaostao dekoder na Tizenu
    // je tačno ono zbog čega sljedeći video ostane crn.
    var leaving = [];
    for (var i = 0; i < videos.length; i++) {
      if (videos[i].shown || i === activeVideo) leaving.push(videos[i]);
    }
    activeVideo = -1;
    for (var k = 0; k < leaving.length; k++) {
      cancelWait(leaving[k]);   // frejm koji tek stigne više nikog ne zanima
      releaseLater(leaving[k], nextItem);
    }
  }

  // Slot izlazi iz kadra: pauza i skrivanje odmah po isteku prelaza, a
  // oslobađanje samo ako sljedeća stavka nije taj isti video.
  function releaseLater(slot, nextItem) {
    setTimeout(function () {
      if (activeVideo >= 0 && videos[activeVideo] === slot) return;   // opet je u kadru
      hideVideo(slot);
      if (nextItem && nextItem.type === 'video' && slot.src && slot.src === nextItem.url) {
        seekVideo(slot.el, 0);
        return;
      }
      releaseVideo(slot);
    }, FADE_MS);
  }

  function showItem(index, startMs) {
    var item = current.items[index];
    if (!item) return;

    // Zaostali preload prethodnog prelaza bi prepisao sloj ili slot koji upravo
    // postaje aktivan — sloj bi ostao bez stavke ili sa pogrešnom.
    if (preloadTimer) { clearTimeout(preloadTimer); preloadTimer = null; }

    shownIndex = index;
    shownItem = item;
    shownStartMs = startMs;

    var nextItem = current.items[(index + 1) % current.items.length] || null;

    if (item.type === 'video') showVideo(item, startMs, nextItem);
    else showImage(item, startMs, nextItem);

    // Nakon prelaza sljedeća stavka odmah ide u slobodan sloj odnosno slot,
    // da dekodiranje ne padne na trenutak prebacivanja.
    preloadTimer = setTimeout(function () {
      preloadTimer = null;
      if (!nextItem) return;
      if (nextItem.type === 'video') preloadVideo(nextItem);
      else preloadImage(nextItem);
    }, FADE_MS + 100);
  }

  function preloadImage(item) {
    var idle = layers[1 - activeLayer];
    idle.item = null;
    if (idle.img.getAttribute('src') !== item.url) idle.img.src = item.url;
  }

  function preloadVideo(item) {
    var slot = slotFor(item);
    if (slot.shown || slotIndex(slot) === activeVideo) return;   // nema slobodnog
    attachVideo(slot, item);
    slot.el.pause();
    seekVideo(slot.el, 0);
  }

  // Prelaz se zakazuje na tačan trenutak po serverskom satu, ne petljom.
  function scheduleTransition() {
    if (itemTimer) { clearTimeout(itemTimer); itemTimer = null; }
    var state = cycleState(serverNow());
    if (!state) return;

    var delay = state.boundaryMs - serverNow();
    if (delay < 4) delay = 4;   // tajmer zna opaliti koji ms ranije

    itemTimer = setTimeout(function () {
      var t = serverNow();
      var s = cycleState(t);   // ponovni proračun je autoritativan, gasi zaostatak tajmera
      if (s) {
        // Ako je tajmer opalio prije granice, ovo je i dalje ista stavka iz
        // istog ciklusa — ne prikazuj je ponovo, samo zakaži nanovo. Kod
        // plejliste od jedne stavke ciklus se prepoznaje po novom početku.
        var repeat = s.index === shownIndex && shownItem &&
          Math.abs(shownStartMs - s.startMs) < 200;
        if (!repeat) showItem(s.index, s.startMs);
      }
      scheduleTransition();
    }, delay);
  }

  function startPlayback() {
    hideOverlay();
    shownIndex = -1;   // nova plejlista: prikaz se uvijek osvježava
    shownItem = null;
    shownStartMs = 0;
    var t = serverNow();
    var state = cycleState(t);
    if (!state) {
      showOverlay('Plejlista je prazna.');
      return;
    }
    showItem(state.index, state.startMs);
    scheduleTransition();
  }

  // Transform se svakog frejma računa iz serverskog vremena — ne iz CSS
  // animacije — pa su sva tri panela u istoj fazi po definiciji.
  function tick() {
    requestAnimationFrame(tick);
    var t = serverNow();

    for (var i = 0; i < layers.length; i++) {
      var layer = layers[i];
      if (!layer.item) continue;
      var p = clamp01((t - layer.startMs) / layer.item.durMs);
      var tf = motionTransform(layer.item.motion, p);
      layer.el.style.transform = tf;
      layer.el.style.webkitTransform = tf;
    }

    if (HUD_ON) drawHud(t);
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // Slika ne može zaostati — video može. Zato se pozicija stalno poredi sa
  // serverskim satom: sitna razlika se popravlja brzinom reprodukcije, velika
  // skokom. Skok se vidi na zidu, pa je zadnja opcija.
  var videoDriftS = 0;

  function syncVideo() {
    if (activeVideo < 0) { videoDriftS = 0; return; }

    var slot = videos[activeVideo];
    if (!slot.item || slot.item.type !== 'video') { videoDriftS = 0; return; }

    var video = slot.el;
    if (video.seeking || video.readyState < 2) return;

    var wanted = (serverNow() - slot.startMs) / 1000;
    if (wanted < 0 || wanted > slot.item.durMs / 1000) return;

    videoDriftS = video.currentTime - wanted;
    var drift = Math.abs(videoDriftS);

    if (drift > VIDEO_HARD_S) {
      video.currentTime = wanted;
      video.playbackRate = 1;
    } else if (drift > VIDEO_SOFT_S) {
      var rate = 1 - videoDriftS * 0.5;
      video.playbackRate = rate < 0.94 ? 0.94 : (rate > 1.06 ? 1.06 : rate);
    } else if (video.playbackRate !== 1) {
      video.playbackRate = 1;
    }

    // Tizen zna pauzirati video kad izgubi fokus ili kad panel prijeđe u
    // štednju; vraćamo ga bez čekanja na sljedeći prelaz.
    if (video.paused) {
      var promise = video.play();
      if (promise && promise.catch) promise.catch(function () {});
    }
  }

  // ------------------------------------------------------------------- plejlista

  function fetchPlaylist() {
    return fetch('/api/playlist.json', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' na /api/playlist.json');
      return res.json();
    });
  }

  function pollPlaylist() {
    return fetchPlaylist().then(function (pl) {
      setBezel(Number(pl.bezel));

      // Server je u međuvremenu promovisao `next` u `current`, a mi ga već imamo.
      if (pl.current && pending && pl.current.version === pending.version) {
        promotePending();
      }

      if (pl.current && (!current || current.version !== pl.current.version)) {
        // Verziju koju nemamo u memoriji učitavamo pa tek onda prebacujemo.
        if (!pending || pending.version !== pl.current.version) {
          return loadAndSwap(pl.current);
        }
      }

      if (pl.next && pl.next.version !== (current && current.version) &&
          pl.next.version !== (pending && pending.version) &&
          pl.next.version !== loadingVersion) {
        return preloadNext(pl.next);
      }

      // `next` je povučen sa servera prije nego što je stigao red na njega.
      if (!pl.next && pending && pl.current && pl.current.version !== pending.version) {
        releaseBundle(pending);
        pending = null;
        readyVersion = null;
        if (switchTimer) { clearTimeout(switchTimer); switchTimer = null; }
      }

      return null;
    });
  }

  function loadAndSwap(source) {
    loadingVersion = source.version;
    return loadBundle(source, function (loaded, total, bytes) {
      if (!current) {
        showOverlay('Učitavanje sadržaja… ' + loaded + ' / ' + total +
          '   ' + (bytes / 1048576).toFixed(1) + ' MB');
      }
    }).then(function (bundle) {
      loadingVersion = null;
      var old = current;
      current = bundle;
      startPlayback();
      // Stari blob URL-ovi se puštaju tek kad prelaz prođe: sloj koji izlazi
      // još prikazuje stari sadržaj, a video bi na oduzet URL stao usred fadea.
      setTimeout(function () { releaseBundle(old); }, FADE_MS + 1000);
      log('aktivna verzija ' + bundle.version + ', ' + bundle.items.length + ' stavki');
    });
  }

  function preloadNext(source) {
    loadingVersion = source.version;
    log('preuzimam next ' + source.version + ' u pozadini');
    return loadBundle(source, null).then(function (bundle) {
      loadingVersion = null;
      releaseBundle(pending);
      pending = bundle;
      readyVersion = bundle.version;
      scheduleSwitch();
    }).catch(function (err) {
      loadingVersion = null;
      throw err;
    });
  }

  // Svi paneli prebacuju u istom trenutku — bez reloada stranice.
  function scheduleSwitch() {
    if (switchTimer) { clearTimeout(switchTimer); switchTimer = null; }
    if (!pending || !pending.activeFrom) return;
    var delay = pending.activeFrom - serverNow();
    if (delay < 0) delay = 0;
    switchTimer = setTimeout(promotePending, delay);
  }

  function promotePending() {
    if (!pending) return;
    if (switchTimer) { clearTimeout(switchTimer); switchTimer = null; }
    var old = current;
    current = pending;
    pending = null;
    readyVersion = null;
    startPlayback();
    // Stare blob URL-ove puštamo tek kad prelaz sigurno prođe.
    setTimeout(function () { releaseBundle(old); }, FADE_MS + 1000);
    log('prebačeno na verziju ' + current.version);
  }

  // ------------------------------------------------------------------ heartbeat

  function heartbeat() {
    var body = {
      displej: DISPLEJ,
      version: current ? current.version : null,
      ready: readyVersion,
      itemId: shownItem ? shownItem.id : null,
      clockOffsetMs: Math.round(clock.offsetMs * 10) / 10,
      uptimeS: Math.round((monoNow() - bootMonoMs) / 1000),
      error: lastError
    };

    return fetch('/api/heartbeat', {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'x-panel-token': PANEL_TOKEN },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' na /api/heartbeat');
      return res.json();
    }).then(function (data) {
      // Greška je isporučena adminu; ako je mreža opet tu, ne nosimo je dalje.
      lastError = null;
      if (data && data.command === 'reload') {
        log('komanda: reload');
        location.reload();
      } else if (data && data.command === 'resync') {
        log('komanda: resync');
        return syncClock();
      }
      return null;
    });
  }

  // -------------------------------------------------------------- noćni reload

  function scheduleNightlyReload() {
    var now = new Date(serverNow());
    var target = new Date(now.getTime());
    target.setHours(RELOAD_HOUR, 0, 0, 0);
    if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);

    var delay = target.getTime() - now.getTime();
    setTimeout(function () {
      // Reload samo ako server odgovara — panel bez mreže inače ostane na praznom.
      fetch('/time?_=' + Date.now(), { cache: 'no-store' }).then(function (res) {
        if (res.ok) location.reload();
        else scheduleRetry();
      }).catch(scheduleRetry);
    }, delay);

    function scheduleRetry() {
      log('noćni reload odgođen — server nije dostupan');
      setTimeout(scheduleNightlyReload, 600000);
    }
  }

  // ---------------------------------------------------------------- prikaz stanja

  function showOverlay(text, big) {
    overlayEl.className = '';
    overlayTextEl.innerHTML = big
      ? '<div class="big">' + escapeHtml(big) + '</div>' + escapeHtml(text)
      : escapeHtml(text);
  }

  function hideOverlay() { overlayEl.className = 'hidden'; }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function shortName(url) {
    if (!url) return '—';
    var parts = String(url).split('/');
    return parts[parts.length - 1];
  }

  var logLines = [];
  function log(msg) {
    logLines.push(msg);
    if (logLines.length > 6) logLines.shift();
    if (window.console && console.log) console.log('[zid]', msg);
  }

  function videoHudLine() {
    if (activeVideo < 0) return '—';
    var slot = videos[activeVideo];
    if (!slot.item) return '—';

    var v = slot.el;
    var parts = [
      'pozicija ' + v.currentTime.toFixed(2) + ' s',
      'zaostatak ' + (videoDriftS * 1000).toFixed(0) + ' ms',
      'brzina ' + v.playbackRate.toFixed(3),
      'readyState ' + v.readyState,
      v.videoWidth + ' × ' + v.videoHeight
    ];
    if (v.error) parts.push('greška ' + v.error.code);
    if (slot.item.whole) parts.push('CIJELI KADAR (stara objava)');
    return parts.join(', ');
  }

  function drawHud(t) {
    var state = cycleState(t);
    var lines = [
      'panel        ' + DISPLEJ + '   ' + geom.panelW + ' × ' + geom.panelH + ' css px',
      'bezel        ' + geom.bezel + ' px   wall ' + geom.wallH + ' px',
      'sat          offset ' + clock.offsetMs.toFixed(1) + ' ms, rtt ' + clock.rttMs.toFixed(1) +
        ' ms, drift ' + clock.lastDriftMs.toFixed(1) + ' ms',
      'serverNow    ' + new Date(t).toISOString().slice(11, 23),
      'verzija      ' + (current ? current.version : '—') +
        (pending ? '  →  ' + pending.version + ' u ' + new Date(pending.activeFrom).toISOString().slice(11, 19) : ''),
      'stavka       ' + (shownItem ? shownItem.id : '—') +
        (state ? '  ' + (state.index + 1) + '/' + current.items.length +
          '  p=' + (state.offset / current.items[state.index].durMs).toFixed(3) : ''),
      'video        ' + videoHudLine(),
      'video fajl   ' + (shownItem && shownItem.type === 'video' ? shortName(shownItem.file) : '—'),
      'keš          ' + lastLoad.cache + ' iz keša, ' + lastLoad.network + ' sa mreže',
      'uptime       ' + Math.round((monoNow() - bootMonoMs) / 1000) + ' s',
      'greška       ' + (lastError || '—'),
      '',
      logLines.join('\n')
    ];
    hudEl.textContent = lines.join('\n');
  }

  // Svaka neuhvaćena greška → crn ekran sa porukom i reload za 15 s.
  var fatalArmed = false;
  function fatal(err) {
    var msg = err && err.message ? err.message : String(err);
    lastError = msg.slice(0, 200);
    if (fatalArmed) return;
    fatalArmed = true;
    showOverlay('Ponovni pokušaj za 15 sekundi.\n' + lastError, 'Panel ' + DISPLEJ + ' — greška');
    setTimeout(function () { location.reload(); }, FATAL_RELOAD_MS);
  }

  window.onerror = function (message, source, line) {
    fatal(new Error(message + ' (' + source + ':' + line + ')'));
    return true;
  };
  window.addEventListener('unhandledrejection', function (e) {
    fatal(e.reason || new Error('Neuhvaćeno odbijanje obećanja'));
  }, false);

  // ------------------------------------------------------------------- pokretanje

  applyGeometry();
  showOverlay('Panel ' + DISPLEJ + ' — sinhronizacija sata…');
  requestAnimationFrame(tick);

  syncClock()
    .then(function () {
      showOverlay('Panel ' + DISPLEJ + ' — učitavanje plejliste…');
      return fetchPlaylist();
    })
    .then(function (pl) {
      setBezel(Number(pl.bezel));
      if (!pl.current) {
        showOverlay('Čekam prvu objavu.', 'Panel ' + DISPLEJ);
        return null;
      }
      return loadAndSwap(pl.current);
    })
    .then(function () {
      // Petlje koje drže zid živ. Greške u njima ne ruše reprodukciju.
      setInterval(function () { syncClock().then(scheduleTransition).catch(softError); }, CLOCK_SYNC_MS);
      setInterval(function () { pollPlaylist().catch(softError); }, PLAYLIST_POLL_MS);
      setInterval(function () { heartbeat().catch(softError); }, HEARTBEAT_MS);
      setInterval(syncVideo, VIDEO_SYNC_MS);
      heartbeat().catch(softError);
      scheduleNightlyReload();
    })
    .catch(fatal);

  // Mrežni prekid ne ruši zid — slike su u memoriji, samo zapamtimo grešku.
  function softError(err) {
    lastError = (err && err.message ? err.message : String(err)).slice(0, 200);
    log('greška: ' + lastError);
  }
})();
</script>
</body>
</html>
